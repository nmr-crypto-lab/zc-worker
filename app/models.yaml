     triggers: "m15510n4ry, bl0wj0b, d0ubl3_bj, d0gg1e, c0wg1rl", civitai: {version: 3405852}}
  - {key: h3_lora_mysticxxx, family: h3_fl2va, role: lora, label: "Mystic XXX v5", dest: loras/civitai/h3,
     civitai: {version: 3416478, file_rx: '^MysticXXX_MMH3-V5\.safetensors$'}}
  - {key: h3_lora_mysticxxx_ref, family: h3_ref2va, role: lora, label: "Mystic XXX v5 (ref)", dest: loras/civitai/h3,
     civitai: {version: 3416478, file_rx: 'ref2va'}}
  - {key: h3_lora_hmnsfw, family: h3_fl2va, role: lora, label: "HMNSFW AIO", dest: loras/civitai/h3, civitai: {version: 3446189}}
  - {key: h3_lora_unlocked, family: h3_fl2va, role: lora, label: "H3 NSFW Unlocked", dest: loras/civitai/h3, civitai: {version: 3478361}}
  - {key: h3_lora_hmpussy, family: h3_fl2va, role: lora, label: "HMPussy", triggers: "pussy, vagina, anus", dest: loras/civitai/h3, civitai: {version: 3436891}}
  - {key: h3_lora_hmbreasts, family: h3_fl2va, role: lora, label: "HMBreasts", triggers: "tits", dest: loras/civitai/h3, civitai: {version: 3268969}}
  - {key: h3_lora_hmcumshot, family: h3_fl2va, role: lora, label: "HMCumshot", triggers: "cumshot", dest: loras/civitai/h3, civitai: {version: 3441237}}
  - {key: h3_lora_bounce, family: h3_fl2va, role: lora, label: "Bouncing Boobs", triggers: "her breast is bouncing up and down", dest: loras/civitai/h3, civitai: {version: 3258590}}
  - {key: h3_lora_motion, family: h3_fl2va, role: lora, label: "Motion Booster", triggers: "dynv2", dest: loras/civitai/h3, civitai: {version: 3228867}}

  # ------------------------------------------------------------------ Upscale / safety
  - {key: age_classifier, family: safety, role: aux, dest: safety/vit-age-classifier, hf_snapshot: nateraw/vit-age-classifier}
  - {key: anime_tagger, family: safety, role: aux, dest: safety/wd-eva02-large-tagger-v3, hf_snapshot: SmilingWolf/wd-eva02-large-tagger-v3,
     allow: ["model.onnx", "selected_tags.csv", "config.json"]}
