<head>

<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#4a5568;--line:#e3e8f0;--chip:#cfd8e6;--acc:#c2410c;--acc-bg:#fde7d9;--ok:#15803d;--blue:#1d4ed8}
.th-memory{--bg:#f4f2ee;--acc:#5b21b6;--acc-bg:#ede9fe;--line:#e6e2da}
.th-kids{--bg:#f5f3ff;--acc:#7c3aed;--acc-bg:#ede9fe}
.th-fun{--bg:#fdf2f8;--acc:#db2777;--acc-bg:#fce7f3}
.th-biz{--bg:#fff7ed;--acc:#ea580c;--acc-bg:#ffedd5}
.th-story{--bg:#f1f4f9;--acc:#1d4ed8;--acc-bg:#dbeafe}
.th-adult{--bg:#0f0d14;--card:#1a1622;--ink:#f4f1f8;--muted:#b9b1c6;--line:#2f2839;--chip:#3a3146;--acc:#db2777;--acc-bg:#3a1630}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.th-adult{background:#0f0d14}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{flex-grow:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:21px;font-weight:900;letter-spacing:-.3px}
.tag18{font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;background:#db2777;color:#fff}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:rgba(127,140,160,.15);display:flex;align-items:center;justify-content:center}
.langs{display:flex;background:rgba(127,140,160,.15);border-radius:12px;padding:3px}
.langs button{height:38px;min-width:34px;padding:0 6px;border:0;border-radius:9px;font-size:13px;font-weight:900;background:transparent}
.langs button.on{background:var(--ink);color:var(--bg)}
.pad{padding:16px 16px 0}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:900;letter-spacing:-.4px}
.sub{margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--muted)}
.h2{font-size:19px;font-weight:900}
.small{font-size:13px;color:var(--muted);line-height:1.4}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(23,32,51,.08)}
.th-adult .card{border:1px solid var(--line);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--chip);background:var(--card);font-size:15px;font-weight:800}
.chip.on{border-color:var(--acc);background:var(--acc-bg)}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:900;padding:0 14px}
.btn2{width:100%;min-height:48px;border:2px solid var(--acc);border-radius:14px;background:var(--card);color:var(--acc);font-size:16px;font-weight:900;padding:0 12px}
.btn3{min-height:46px;border:2px solid var(--chip);border-radius:14px;background:var(--card);font-size:15px;font-weight:800;padding:0 12px}
.btn:disabled,.btn2:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;height:52px;border:2px solid var(--chip);border-radius:14px;padding:0 14px;font-size:17px;background:var(--card)}
textarea.field{height:auto;padding:10px 14px;line-height:1.4;resize:vertical}
.pill{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-bg);color:var(--acc)}
.pill.grey{background:rgba(127,140,160,.2);color:var(--muted)}
.intent{display:flex;gap:12px;align-items:stretch;width:100%;padding:10px;border:0;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(23,32,51,.08);text-align:left}
.thumb{flex:0 0 116px;width:116px;height:116px;border-radius:14px;overflow:hidden;position:relative;background:#94a3b8}
.thumb video,.thumb img,.ex video,.ex img{width:100%;height:100%;object-fit:cover;display:block}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:0 14px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ex{flex:0 0 auto;width:116px;height:116px;border-radius:12px;overflow:hidden;position:relative;background:#94a3b8;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;font-weight:800;padding:0}
.ex span{padding:8px;line-height:1.2}
.foot{display:flex;gap:8px;padding:24px 16px 0}
.foot button{flex:1;height:46px;border:1px dashed var(--chip);border-radius:14px;background:var(--card);color:var(--muted);font-size:14px;font-weight:800}
.bubble{flex-grow:1;background:var(--card);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 2px 8px rgba(23,32,51,.08);font-size:18px;font-weight:900;line-height:1.25}
.pip{flex-shrink:0;display:block;overflow:visible}
.pip .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
.pip .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:look 11s ease-in-out infinite}
.pip .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.3s infinite}
.pip.adult .eye{animation-duration:7.1s}
.pip.adult .body{animation-duration:5.5s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes look{0%,18%{transform:translate(0,0)}24%,38%{transform:translate(-5px,1px)}44%,58%{transform:translate(0,0)}64%,76%{transform:translate(5px,-1px)}82%,100%{transform:translate(0,0)}}
.pip.think .eyes{animation:think 2.6s ease-in-out infinite}
@keyframes think{0%,100%{transform:translate(4px,-6px)}50%{transform:translate(-4px,-6px)}}
.pip.happy .body{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.92)}38%{transform:translateY(-7px) scale(.97,1.04)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 3s ease-in-out infinite}

.layer{position:absolute;left:5%;right:5%;text-align:center;white-space:pre-line;pointer-events:none;line-height:1.12}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .6s}

.tee{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;background:#eef2f8;display:flex;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate{padding:70px 24px 0;text-align:center}

#movie .grid,#mv-lb .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

#movie .item.pick,#mv-lb .item.pick{border-color:var(--acc)}
#movie .err,#mv-lb .err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}
#movie .mv-wrap,#mv-lb .mv-wrap{display:flex;flex-direction:column;gap:16px}
#movie .mv-btn,#mv-lb .mv-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;white-space:nowrap}

#movie .mv-plist,#mv-lb .mv-plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}

</head>

<div id="app"></div>
<div id="movie" hidden></div>
<div id="studio" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
/* ---------------- tiny helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LS = { get(k, d) { try { const v = localStorage.getItem('wishly.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wishly.' + k, JSON.stringify(v)); } catch (e) {} } };
const fileUrl = (p) => '/files/' + p.split('/').map(encodeURIComponent).join('/');

    eyes = happy ? `<path d="M33 50 q6 -8 12 0 M55 50 q6 -8 12 0" fill="none" stroke="#23182b" stroke-width="4.5" stroke-linecap="round"/>`
      : `<ellipse class="eye" cx="39" cy="48" rx="4.6" ry="7.4" fill="#23182b" style="animation-delay:${d2}s"/><ellipse class="eye" cx="61" cy="48" rx="4.6" ry="7.4" fill="#23182b" style="animation-delay:${d2}s"/>`;
  } else {
    defs = `<radialGradient id="pg${n}" cx="40%" cy="28%" r="80%"><stop offset="0" stop-color="#4a2a5e"/><stop offset=".6" stop-color="#22142e"/><stop offset="1" stop-color="#120a19"/></radialGradient>

  if (m(/(футболк|t-shirt|tshirt|кружк|mug|kaos|принт|print)/)) return [L('A print for a T-shirt or a mug!', 'Принт на футболку или кружку!', 'Cetakan untuk kaos atau mug!'), ['home', 'print'], L('Make a print', 'Сделать принт', 'Buat cetakan')];
  if (m(/(приглаш|invit|undang)/)) return [L('Let’s make an invitation.', 'Сделаем приглашение.', 'Ayo bikin undangan.'), ['greet', 'invite'], L('Make an invitation', 'Сделать приглашение', 'Buat undangan')];
  if (m(/(открытк|card|kartu|поздрав|рожден|birthday|ultah|утро|morning|pagi|ночи|night|malam|спасибо|thank|выходн|weekend)/)) return [L('A moving card is the nicest. Let’s make one!', 'Живая открытка — самое приятное. Сделаем!', 'Kartu bergerak paling menyenangkan. Ayo!'), ['greet', 'gifcard'], L('Make a moving card', 'Сделать живую открытку', 'Buat kartu bergerak')];
  return [L('I can make cards, pictures, prints, menus and memes. Try: “a birthday card for my sister”.', 'Я умею открытки, картинки, принты, меню и мемы. Попробуйте: «открытка сестре на день рождения».', 'Aku bisa buat kartu, gambar, cetakan, menu dan meme.'), null, ''];
}
function chatSend(text) {
  if (!text.trim()) return;
  S.chat.push({ me: true, t: text });
  const [reply, goTo, goL] = pipRoute(text);
  S.chat.push({ me: false, t: reply, go: goTo, goL });
  S.chatOpen = true; render();
}
function openTask(sec, task) {
  S.chatOpen = false;
  if (!task) { go('section', { sec }); return; }
  const k = taskById(sec, task);
  if (!k) { go('section', { sec }); return; }
  if (k.upload) { toast(TT().uploadSoon); go('section', { sec }); return; }
  if (k.soon || !k.r) { toast(TT().soonMsg); go('section', { sec }); return; }
  S.ans = {}; S.jobs = []; S.layer = null;
  go('flow', { sec, task, step: 'preview' });
}

/* ---------------- events ---------------- */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'chatBg' && e.target.closest('[data-stop]')) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'lang': S.lang = d.v; LS.set('lang', S.lang); render.keep = true; render(); break;
    case 'back': back(); break;
    case 'home': go('home', { sec: null }); break;
    case 'sec': go('section', { sec: d.sec }); break;
    case 'open': e.preventDefault(); openTask(d.sec, d.task); break;
    case 'soon': toast(TT().soonMsg); break;
    case 'uploadSoon': toast(TT().uploadSoon); break;
    case 'orderSoon': toast(L('Ordering printed things comes later. Download the file meanwhile.', 'Заказ печати появится позже. Пока скачайте файл.', 'Pesan cetak hadir nanti.')); break;
    case 'works': try { S.worksSrv = await api('/api/gallery?limit=90'); } catch (x) { S.worksSrv = []; } go('works'); break;
    case 'adult': go(S.adultOk ? 'adult' : 'gate', { after: 'adult' }); break;
    case 'adultYes': S.adultOk = true; LS.set('adultOk', true); go(S.after || 'adult'); break;
    case 'studio': go(S.adultOk ? 'studio' : 'gate', { after: 'studio' }); break;
    case 'ask': { const v = ($('#ask') || {}).value || ''; if (v.trim()) chatSend(v); else { S.chatOpen = true; render.keep = true; render(); } break; }
    case 'chatOpen': S.chatOpen = true; render.keep = true; render(); setTimeout(() => { const i = $('#chat-in'); if (i) i.focus(); }, 50); break;
    case 'chatClose': case 'chatBg': S.chatOpen = false; render.keep = true; render(); break;
    case 'chatSend': { const i = $('#chat-in'); chatSend(i ? i.value : ''); break; }
    case 'toQs': S.step = 'questions'; go('flow'); break;
    case 'ans': S.ans[d.q] = +d.v; if (d.q === 'text') S.ans.textOwn = ''; render.keep = true; render(); break;
    case 'fill': S.ans[d.q] = d.v; render.keep = true; render(); break;
    case 'make': case 'again': {
      const k = taskById(S.sec, S.task), r = R[k.r];
      const list = r.kind === 'gif' ? r.jobs(S.ans) : [0, 1, 2].map(() => ({ family: 'qwen_image21', prompt: r.prompt(S.ans), width: r.w, height: r.h }));
      if (a === 'make' || !S.layer) S.layer = r.layer ? r.layer(S.ans) : null;
      await startJobs(list); break;
    }
    case 'seeNow': S.step = 'result'; render(); break;
    case 'cancelJobs': for (const j of S.jobs) { if (j.id !== '-' && ['queued', 'running'].includes(j.status)) { try { await api(`/api/jobs/${j.id}/cancel`, {}); } catch (x) {} } } S.step = 'questions'; render(); break;
    case 'pick': S.picked = +d.v; render.keep = true; render(); break;
    case 'lay': S.layer[d.k] = d.k === 'size' ? +d.v : d.v; render.keep = true; render(); break;
    case 'share': await doShare(); break;
    case 'download': try { const f = await finalFile(); dl(f.file); } catch (x) { toast(x.message); } break;
    case 'stTab': S.studio.tab = d.v; S.studio.err = ''; render.keep = true; render(); break;
    case 'stFam': S.studio.fam[S.studio.tab] = d.v; S.studio.err = ''; { const mx = (SFAM_INPUTS[d.v] || [0, 0])[1]; S.studio.inputs = S.studio.inputs.slice(0, mx); } render.keep = true; render(); break;
    case 'stSet': { const st = S.studio, { fam } = sFam(), k = d.k;
      if (k === 'model' || k === 'size') st[k][fam] = d.v; else if (k === 'nvar') st.nvar = +d.v; else st[k] = d.v;
      render.keep = true; render(); break; }
    case 'stTrig': { const st = S.studio, { fam } = sFam(); st.prompt[fam] = ((st.prompt[fam] || '').replace(/\s*$/, '') + (st.prompt[fam] ? ', ' : '') + d.v); render.keep = true; render(); break; }
    case 'stAdv': setTimeout(() => { const dd = el.closest('details') || el; S.studio.advOpen = dd.open; }, 0); break;
    case 'stGo': await studioGo(); break;
    case 'stCancel': try { await api(`/api/jobs/${d.v}/cancel`, {}); } catch (x) {} studioTick(); break;
    case 'stGk': S.studio.gkind = d.v; S.studio.glimit = 30; S.studio.gallery = null; sDoneSig = ''; studioTick(); render.keep = true; render(); break;
    case 'stMore': S.studio.glimit += 30; S.studio.gallery = null; sDoneSig = ''; studioTick(); break;
    case 'stPick': try { S.studio.pickGal = await api('/api/gallery?limit=90&kind=image'); } catch (x) { S.studio.pickGal = []; } S.studio.picking = true; render.keep = true; render(); break;
    case 'stPickOne': { const st = S.studio, { fam } = sFam(), mx = (SFAM_INPUTS[fam] || [0, 1])[1];
      if (st.inputs.includes(d.v)) st.inputs = st.inputs.filter((x) => x !== d.v); else if (st.inputs.length < mx) st.inputs.push(d.v);
      if (mx === 1 && st.inputs.length === 1) st.picking = false; render.keep = true; render(); break; }
    case 'stPickDone': if (el.dataset.act === 'stPickDone' && e.target.closest('[data-stop]') && !e.target.closest('button')) break; S.studio.picking = false; render.keep = true; render(); break;
    case 'stUnpick': S.studio.inputs.splice(+d.v, 1); render.keep = true; render(); break;
    case 'stView': S.studio.view = d.v; S.studio.delArm = false; render.keep = true; render(); break;
    case 'stClose': if (e.target.closest('[data-stop]') && !e.target.closest('button')) break; S.studio.view = null; render.keep = true; render(); break;
    case 'stShare': try { const p = S.studio.view, b = await (await fetch(fileUrl(p))).blob(), f = new File([b], p.split('/').pop(), { type: b.type });
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }); else { dl(f); } } catch (x) { if (x.name !== 'AbortError') toast(x.message); } break;
    case 'stDel': { const st = S.studio; if (!st.delArm) { st.delArm = true; render.keep = true; render(); setTimeout(() => { st.delArm = false; }, 4000); break; }
      try { await api('/api/files/' + st.view.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' }); st.inputs = st.inputs.filter((x) => x !== st.view); st.view = null; st.gallery = null; sDoneSig = ''; } catch (x) { toast(x.message); }
      render.keep = true; render(); studioTick(); break; }
    case 'stUse': { const st = S.studio, p = st.view, f = d.v, tab = STABS().find((t) => t.fams.includes(f));
      if (f === 'h3_ref2va' || f === 'qwen_image21') { if ((st.fam[tab.id] !== f) || !st.inputs.length) st.inputs = []; if (!st.inputs.includes(p)) st.inputs.push(p); } else st.inputs = [p];
      st.tab = tab.id; st.fam[tab.id] = f; st.view = null; render(); break; }
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.q) { S.ans[el.dataset.q] = el.value; return; }
  if (el.dataset.lay && S.layer) { S.layer.text = el.value; const st = $('.stage'); if (st) { st.querySelectorAll('.layer').forEach((x) => x.remove()); st.insertAdjacentHTML('beforeend', layerCss(S.layer)); } return; }
  if (el.dataset.st) { const st = S.studio, { fam } = sFam(), k = el.dataset.st;
    if (k === 'prompt' || k === 'neg') st[k][fam] = el.value;
    else if (k === 'sec') { st.sec[fam] = +el.value; const v = $('#st-secv'); if (v) v.textContent = el.value; }
    else if (k === 'lora') { st.loras[el.dataset.k] = +el.value; const v = document.getElementById('lv-' + el.dataset.k); if (v) v.textContent = (+el.value).toFixed(2); }
    else st[k] = el.value; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  const el = e.target; if (!el.dataset || !el.dataset.enter) return;
  e.preventDefault();
  if (el.dataset.enter === 'ask') { if (el.value.trim()) chatSend(el.value); }
  if (el.dataset.enter === 'chatSend') chatSend(el.value);
});
history.replaceState({ s: 'home' }, '');
render();
</script>
