<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#4a5568;--line:#e3e8f0;--chip:#cfd8e6;--acc:#c2410c;--acc-bg:#fde7d9;--cta:#c2410c;--ok:#15803d;--blue:#1d4ed8}
.th-memory{--bg:#f4f2ee;--acc:#5b21b6;--acc-bg:#ede9fe;--line:#e6e2da}
.th-kids{--bg:#f5f3ff;--acc:#7c3aed;--acc-bg:#ede9fe}
.th-fun{--bg:#fdf2f8;--acc:#db2777;--acc-bg:#fce7f3}
.th-biz{--bg:#fff7ed;--acc:#ea580c;--acc-bg:#ffedd5}
.th-story{--bg:#f1f4f9;--acc:#1d4ed8;--acc-bg:#dbeafe}
.th-adult{--cta:#db2777;--bg:#0f0d14;--card:#1a1622;--ink:#f4f1f8;--muted:#b9b1c6;--line:#2f2839;--chip:#3a3146;--acc:#db2777;--acc-bg:#3a1630}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.th-adult{background:#0f0d14}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{flex-grow:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:21px;font-weight:900;letter-spacing:-.3px}
.tag18{font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;background:#db2777;color:#fff}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:rgba(127,140,160,.15);display:flex;align-items:center;justify-content:center}
.langs{display:flex;background:rgba(127,140,160,.15);border-radius:12px;padding:3px}
.langs button{height:38px;min-width:34px;padding:0 6px;border:0;border-radius:9px;font-size:13px;font-weight:900;background:transparent}
.langs button.on{background:var(--ink);color:var(--bg)}
.pad{padding:16px 16px 0}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:900;letter-spacing:-.4px}
.sub{margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--muted)}
.h2{font-size:19px;font-weight:900}
.small{font-size:13px;color:var(--muted);line-height:1.4}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(23,32,51,.08)}
.th-adult .card{border:1px solid var(--line);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--chip);background:var(--card);font-size:15px;font-weight:800}
.chip.on{border-color:var(--acc);background:var(--acc-bg)}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--cta);color:#fff;font-size:17px;font-weight:900;padding:0 14px}
.btn2{width:100%;min-height:48px;border:2px solid var(--acc);border-radius:14px;background:var(--card);color:var(--acc);font-size:16px;font-weight:900;padding:0 12px}
.btn3{min-height:46px;border:2px solid var(--chip);border-radius:14px;background:var(--card);font-size:15px;font-weight:800;padding:0 12px}
.btn:disabled,.btn2:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;height:52px;border:2px solid var(--chip);border-radius:14px;padding:0 14px;font-size:17px;background:var(--card)}
textarea.field{height:auto;padding:10px 14px;line-height:1.4;resize:vertical}
.pill{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-bg);color:var(--acc)}
.pill.grey{background:rgba(127,140,160,.2);color:var(--muted)}
.intent{display:flex;gap:12px;align-items:stretch;width:100%;padding:10px;border:0;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(23,32,51,.08);text-align:left}
.thumb{flex:0 0 116px;width:116px;height:116px;border-radius:14px;overflow:hidden;position:relative;background:#94a3b8}
.thumb video,.thumb img,.ex video,.ex img{width:100%;height:100%;object-fit:cover;display:block}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:0 14px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ex{flex:0 0 auto;width:116px;height:116px;border-radius:12px;overflow:hidden;position:relative;background:#94a3b8;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;font-weight:800;padding:0}
.ex span{padding:8px;line-height:1.2}
.foot{display:flex;gap:8px;padding:24px 16px 0}
.foot button{flex:1;height:46px;border:1px dashed var(--chip);border-radius:14px;background:var(--card);color:var(--muted);font-size:14px;font-weight:800}
.bubble{flex-grow:1;background:var(--card);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 2px 8px rgba(23,32,51,.08);font-size:18px;font-weight:900;line-height:1.25}
.pip{flex-shrink:0;display:block;overflow:visible}
.pip .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
.pip .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:look 11s ease-in-out infinite}
.pip .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.3s infinite}
.pip.adult .eye{animation-duration:7.1s}
.pip.adult .body{animation-duration:5.5s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes look{0%,18%{transform:translate(0,0)}24%,38%{transform:translate(-5px,1px)}44%,58%{transform:translate(0,0)}64%,76%{transform:translate(5px,-1px)}82%,100%{transform:translate(0,0)}}
.pip.think .eyes{animation:think 2.6s ease-in-out infinite}
@keyframes think{0%,100%{transform:translate(4px,-6px)}50%{transform:translate(-4px,-6px)}}
.pip.happy .body{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.92)}38%{transform:translateY(-7px) scale(.97,1.04)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pip *,.bob{animation:none!important}}
.cta-bar{position:sticky;bottom:0;z-index:15;margin-top:18px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent)}
svg.pip{cursor:pointer}
#pillbox:empty{display:none}
.top .brand{overflow:hidden}
.busy{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:0;border-radius:18px;background:var(--acc-bg);color:var(--ink);font-size:13px;font-weight:900;white-space:nowrap}
.busy i{width:10px;height:10px;border-radius:50%;background:var(--cta);animation:bz 1s ease-in-out infinite alternate}
.busy.done{background:#dcfce7}.busy.done i{background:#15803d;animation:none}
@keyframes bz{from{opacity:.3}to{opacity:1}}
.hex{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;width:92px;border:0;background:none;padding:0;text-align:left;font-size:12px;font-weight:800;color:var(--ink);line-height:1.2}
.typing{display:flex;gap:5px;padding:14px 16px!important}.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#hchat .nw{animation:mi .25s ease-out}@keyframes mi{from{opacity:0;transform:translateY(6px)}}
.hcard{position:relative;width:min(280px,100%);aspect-ratio:1/1;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(23,32,51,.18);background:var(--chip)}
.hcard video,.hcard img{width:100%;height:100%;object-fit:cover;display:block}
.hcap{position:absolute;left:6%;right:6%;bottom:7%;text-align:center;font-family:Caveat,cursive;font-weight:700;font-size:clamp(26px,9vw,40px);line-height:1.05;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
.hcap.top{bottom:auto;top:7%}
.hoffer{display:flex;gap:10px;align-items:center;max-width:100%;background:var(--card);border-radius:16px;padding:8px;box-shadow:0 1px 3px rgba(23,32,51,.08)}
.lnk{border:0;background:none;padding:0;color:var(--cta);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px}
.hsec{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hsec button{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px;border:0;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(23,32,51,.08);text-align:left;font-size:14px;font-weight:800;line-height:1.15;color:var(--ink)}
.hsec .thumb{flex:0 0 40px;width:40px;height:40px;border-radius:10px}
#hchat .chip{min-height:38px;padding:0 14px;font-size:15px}
.algrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.algrid .upslot{aspect-ratio:1/1;border-radius:14px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.book{position:relative;max-width:min(520px,calc((100vh - 290px) * .75));min-width:260px;margin:0 auto;perspective:1800px;display:flex}
.book.wide{max-width:min(1000px,calc((100vh - 250px) * 1.5))}
.pg{flex:1;aspect-ratio:3/4;box-sizing:border-box;padding:8% 9%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:4px 14px 14px 4px;
  background:radial-gradient(ellipse at 30% 20%,#fffdf7,#f5ecd9 70%,#ecdfc4);box-shadow:inset 18px 0 24px -18px rgba(90,60,20,.35),0 8px 28px rgba(40,30,10,.22);color:#3b2f22;transform-origin:left center}
.book.wide .pg:first-child:not(:last-child){border-radius:14px 4px 4px 14px;box-shadow:inset -18px 0 24px -18px rgba(90,60,20,.35),0 8px 28px rgba(40,30,10,.22)}
.pg .ph{width:88%;background:#fff;padding:4% 4% 5%;box-shadow:0 3px 10px rgba(40,30,10,.25)}
.pg .ph video,.pg .ph img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#ddd}
.pg .cap{font-family:Caveat,cursive;font-size:27px;line-height:1.1;text-align:center;color:#4a3826}
.pg .chap{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;text-align:center;letter-spacing:.3px;color:#6b4a2b}
.pg.cover{background:linear-gradient(150deg,#2f4a3a,#1e3328 60%,#16261d);color:#f3e6c4;box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35)}
.pg .ctitle{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;text-align:center;line-height:1.15;color:#e9cf8f;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pg .cph{width:64%;padding:3%;border:2px solid #c9a96266;border-radius:4px}.pg .cph video,.pg .cph img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.pg .cyear{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#c9a962}
.alive{animation:kb 9s ease-in-out infinite alternate}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
.turnL,.turnR{position:absolute;top:0;bottom:0;width:30%;border:0;background:none;cursor:pointer;z-index:2}.turnL{left:0}.turnR{right:0}
.book.go-next .pg:last-of-type{transition:transform .26s ease-in,opacity .26s;transform:rotateY(-75deg);opacity:.4}
.book.go-prev .pg:first-of-type{transition:transform .26s ease-in,opacity .26s;transform-origin:right center;transform:rotateY(75deg);opacity:.4}
.book.in-next .pg{animation:pin .4s ease-out}.book.in-prev .pg{animation:pin2 .4s ease-out}
@keyframes pin{from{transform:rotateY(60deg);transform-origin:left center;opacity:.5}}@keyframes pin2{from{transform:rotateY(-60deg);transform-origin:right center;opacity:.5}}
.pbook{flex:0 0 110px;width:110px;padding:8px;border-radius:4px 10px 10px 4px;background:linear-gradient(150deg,#2f4a3a,#16261d);display:flex;flex-direction:column;gap:6px;align-items:center;color:#e9cf8f;font-size:11px;text-align:center}
.pbook video,.pbook img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.intent.core{padding:10px;min-height:120px}.intent.core .thumb{flex-basis:100px;width:100px;height:100px}
.hstagew{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.pfloat{position:relative;animation:pfl 3.2s ease-in-out infinite}@keyframes pfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hpop{position:absolute;left:86%;top:4%;transform:scale(.6);transform-origin:0 100%;opacity:0;width:max-content;max-width:min(150px,calc(50vw - 40px));text-align:left;z-index:3;background:var(--ink);color:#fff;font-size:14px;font-weight:800;padding:6px 12px;border-radius:14px;pointer-events:none}
.hpop.on{animation:pop 2.2s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.6)}12%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px) scale(1)}}
#hstage{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
.hbub{position:relative;background:var(--card);border-radius:20px;padding:13px 18px;font-size:18px;font-weight:700;line-height:1.35;box-shadow:0 2px 10px rgba(23,32,51,.1);max-width:100%;min-height:24px}
.hbub::before{content:"";position:absolute;left:50%;top:-8px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--card)}
.hme{align-self:flex-end;background:var(--acc-bg);border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:15px;font-weight:700;max-width:85%;order:-1;margin-bottom:-2px}
.hx{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;transition:opacity .35s,transform .35s}.hx.later{opacity:0;transform:translateY(8px);pointer-events:none}
.pl .eh{display:none}.pl.happy .eo{display:none}.pl.happy .eh{display:block}
.pl .glow{opacity:0;transition:opacity .4s}.pl.happy .glow{opacity:1}
.pl.talk .body{animation:ptalk .34s ease-in-out infinite alternate}@keyframes ptalk{from{transform:scale(1,1)}to{transform:scale(1.03,.96)}}
.pl .lean{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s}
.pl.listen .lean{transform:translateY(3px) rotate(-5deg)}.pl.listen .eyes{animation:none;transform:translate(-2px,5px)}
.pl.sway .lean{animation:psway 1.5s ease-in-out}@keyframes psway{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.pl.hop .body{animation:hop .9s ease-in-out 1}
.fab{position:fixed;right:max(16px,calc(50vw - 224px));bottom:18px;z-index:20;width:64px;height:64px;border-radius:50%;border:0;background:var(--card);box-shadow:0 6px 18px rgba(23,32,51,.28);padding:4px;display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(23,32,51,.45);display:flex;flex-direction:column;justify-content:flex-end}
.sheet>div{max-width:480px;width:100%;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px;max-height:85vh;display:flex;flex-direction:column}
.msgs{flex-grow:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0 10px;min-height:180px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.35}
.m.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#172033}
.stage img,.stage video{display:block;width:100%;height:auto}
.layer{position:absolute;left:5%;right:5%;text-align:center;white-space:pre-line;pointer-events:none;line-height:1.12}
.lphoto{position:absolute;transform:translate(-50%,-50%);object-fit:cover;border:1.4cqw solid #fff;box-shadow:0 1cqw 4cqw rgba(0,0,0,.35);pointer-events:none}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.upslot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:4/5;border-radius:18px;border:2px dashed #94a3b8;background:#fff;color:var(--muted);font-size:14px;font-weight:800;text-align:center;padding:10px;box-sizing:border-box;cursor:pointer;overflow:hidden}
.upslot.on{border:0;padding:0;background:#172033}
.upslot img{width:100%;height:100%;object-fit:cover;display:block}
.upslot .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;font-weight:900;line-height:32px;padding:0;cursor:pointer}
.upslot .cap{position:absolute;left:0;right:0;bottom:0;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;font-weight:800}
.upslot input{position:absolute;width:1px;height:1px;opacity:0}
.cline{display:block;width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;text-align:left;font:inherit;font-size:15px;font-weight:700;color:#172033;cursor:text;line-height:1.3}
.cline.cap{background:#fef9c3;border-color:#eab308;font-size:14px;font-weight:800}
.hpic{flex-shrink:0;width:88px;height:88px;border-radius:14px;overflow:hidden;background:#e2e8f0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box}
.hpic img{width:100%;height:100%;object-fit:cover;display:block}
.ppic{position:relative;aspect-ratio:1/1;border-radius:12px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ppic span{position:relative;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:800;color:#334155}
.side-acts{display:none;flex-direction:column;gap:10px;padding:14px 16px 0}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:900;color:var(--acc);cursor:pointer;text-decoration:underline}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vthumb{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:4px solid transparent;padding:0;background:#cbd5e1;position:relative}
.vthumb.on{border-color:var(--acc)}
.vthumb img,.vthumb video{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:10px;background:rgba(127,140,160,.25);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .6s}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;max-width:90vw;text-align:center}
.tee{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;background:#eef2f8;display:flex;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gate{padding:70px 24px 0;text-align:center}
#movie,#mv-lb{--panel:#fff;--panel2:#f3f6fb;--line:#e3e8f0;--text:#172033;--mut:#4a5568;--acc:#1d4ed8;--acc2:#172033;--ok:#15803d;--warn:#b45309;--err:#dc2626;--r:16px;color:var(--text);font-size:14px;line-height:1.45}
#movie{max-width:480px;margin:0 auto;padding:12px 16px 110px;background:var(--bg)}#movie .card{margin-bottom:12px}#movie .mv-wrap{gap:12px}
#mv-lb .mv-form{max-height:86vh;overflow:auto}
#movie .card,#mv-lb .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
#movie .tabs,#mv-lb .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#movie .tab,#mv-lb .tab{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#movie .tab.on,#mv-lb .tab.on{background:var(--acc2);border-color:var(--acc2)}

const LS = { get(k, d) { try { const v = localStorage.getItem('wishly.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wishly.' + k, JSON.stringify(v)); } catch (e) {} } };
const fileUrl = (p) => '/files/' + p.split('/').map(encodeURIComponent).join('/');

  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',

};

  { id: 'thanks', n: L('Thank you', 'Спасибо', 'Terima kasih'), cap: L('Thank you!', 'Спасибо!', 'Terima kasih!'), scene: 'a bouquet of pink roses with sparkles, petals gently falling, soft pastel light', pos: 'bottom' },

  { id: 'miss', n: L('Miss you', 'Скучаю', 'Kangen'), cap: L('Miss you!', 'Скучаю!', 'Kangen kamu!'), scene: 'a red heart balloon floating over a park bench at sunset, autumn leaves drifting in the wind', pos: 'top' },
  { id: 'weekend', n: L('Happy weekend', 'Хороших выходных', 'Selamat berakhir pekan'), cap: L('Happy weekend!', 'Хороших выходных!', 'Selamat berakhir pekan!'), scene: 'a hammock between palm trees on a tropical beach, waves rolling in, leaves swaying, sunny day', pos: 'top' },

        try { const { ids } = await api('/api/recipe/' + r.server, r.payload(S.ans)); S.jobs = ids.map((id) => ({ id, status: 'queued' })); }
        catch (x) { S.jobs = [{ id: '-', status: 'error', error: x.message }]; }
        S.step = 'gen'; history.replaceState({ s: 'flow', sec: S.sec, task: S.task, step: 'gen' }, ''); render(); poll(); break;
      }
      const list = r.jobs ? r.jobs(S.ans, r.multi ? ups : S.ups) : [0, 1, 2].map(() => ({ family: 'qwen_image21', prompt: r.prompt(S.ans), width: r.w, height: r.h }));
      await startJobs(list); break;
    }
    case 'seeNow': S.step = 'result'; render(); break;
    case 'cancelJobs': for (const j of S.jobs) { if (j.id !== '-' && ['queued', 'running'].includes(j.status)) { try { await api(`/api/jobs/${j.id}/cancel`, {}); } catch (x) {} } } S.step = 'questions'; render(); break;
    case 'pick': S.picked = +d.v; render.keep = true; render(); break;
    case 'lay': S.layer[d.k] = d.k === 'size' ? +d.v : d.v; render.keep = true; render(); break;
    case 'share': await doShare(); break;
    case 'download': try { const f = await finalFile(); dl(f.file); } catch (x) { toast(x.message); } break;
    case 'stTab': S.studio.tab = d.v; S.studio.err = ''; render.keep = true; render(); break;
    case 'stFam': S.studio.fam[S.studio.tab] = d.v; S.studio.err = ''; { const mx = (SFAM_INPUTS[d.v] || [0, 0])[1]; S.studio.inputs = S.studio.inputs.slice(0, mx); } render.keep = true; render(); break;
    case 'stSet': { const st = S.studio, { fam } = sFam(), k = d.k;
      if (k === 'model' || k === 'size') st[k][fam] = d.v; else if (k === 'nvar') st.nvar = +d.v; else st[k] = d.v;
      render.keep = true; render(); break; }
    case 'stTrig': { const st = S.studio, { fam } = sFam(); st.prompt[fam] = ((st.prompt[fam] || '').replace(/\s*$/, '') + (st.prompt[fam] ? ', ' : '') + d.v); render.keep = true; render(); break; }
    case 'stAdv': setTimeout(() => { const dd = el.closest('details') || el; S.studio.advOpen = dd.open; }, 0); break;
    case 'stGo': await studioGo(); break;
    case 'stCancel': try { await api(`/api/jobs/${d.v}/cancel`, {}); } catch (x) {} studioTick(); break;
    case 'stGk': S.studio.gkind = d.v; S.studio.glimit = 30; S.studio.gallery = null; sDoneSig = ''; studioTick(); render.keep = true; render(); break;
    case 'stMore': S.studio.glimit += 30; S.studio.gallery = null; sDoneSig = ''; studioTick(); break;
    case 'stPick': try { S.studio.pickGal = await api('/api/gallery?limit=90&kind=image'); } catch (x) { S.studio.pickGal = []; } S.studio.picking = true; render.keep = true; render(); break;
    case 'stPickOne': { const st = S.studio, { fam } = sFam(), mx = (SFAM_INPUTS[fam] || [0, 1])[1];
      if (st.inputs.includes(d.v)) st.inputs = st.inputs.filter((x) => x !== d.v); else if (st.inputs.length < mx) st.inputs.push(d.v);
      if (mx === 1 && st.inputs.length === 1) st.picking = false; render.keep = true; render(); break; }
    case 'stPickDone': if (el.dataset.act === 'stPickDone' && e.target.closest('[data-stop]') && !e.target.closest('button')) break; S.studio.picking = false; render.keep = true; render(); break;
    case 'stUnpick': S.studio.inputs.splice(+d.v, 1); render.keep = true; render(); break;
    case 'stView': S.studio.view = d.v; S.studio.delArm = false; render.keep = true; render(); break;
    case 'stClose': if (e.target.closest('[data-stop]') && !e.target.closest('button')) break; S.studio.view = null; render.keep = true; render(); break;
    case 'stShare': try { const p = S.studio.view, b = await (await fetch(fileUrl(p))).blob(), f = new File([b], p.split('/').pop(), { type: b.type });
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }); else { dl(f); } } catch (x) { if (x.name !== 'AbortError') toast(x.message); } break;
    case 'stDel': { const st = S.studio; if (!st.delArm) { st.delArm = true; render.keep = true; render(); setTimeout(() => { st.delArm = false; }, 4000); break; }
      try { await api('/api/files/' + st.view.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' }); st.inputs = st.inputs.filter((x) => x !== st.view); st.view = null; st.gallery = null; sDoneSig = ''; } catch (x) { toast(x.message); }
      render.keep = true; render(); studioTick(); break; }
    case 'stUse': { const st = S.studio, p = st.view, f = d.v, tab = STABS().find((t) => t.fams.includes(f));
      if (f === 'h3_ref2va' || f === 'qwen_image21') { if ((st.fam[tab.id] !== f) || !st.inputs.length) st.inputs = []; if (!st.inputs.includes(p)) st.inputs.push(p); } else st.inputs = [p];
      st.tab = tab.id; st.fam[tab.id] = f; st.view = null; render(); break; }
    default: if (/^a[A-Z]/.test(a)) await aAct(a, d); else if (/^c[A-Z]/.test(a)) await cAct(a, d);
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.q) { S.ans[el.dataset.q] = el.value; return; }
  if (el.dataset.cname != null) { const u = S.c.people[+el.dataset.cname]; if (u) u.name = el.value; return; }
  if (el.id === 'c-idea') { S.c.idea = el.value; return; }
  if (el.dataset.lay && S.layer) { S.layer.text = el.value; const st = $('.stage'); if (st) { st.querySelectorAll('.layer').forEach((x) => x.remove()); st.insertAdjacentHTML('beforeend', layerCss(S.layer)); } return; }
  if (el.dataset.st) { const st = S.studio, { fam } = sFam(), k = el.dataset.st;
    if (k === 'prompt' || k === 'neg') st[k][fam] = el.value;
    else if (k === 'sec') { st.sec[fam] = +el.value; const v = $('#st-secv'); if (v) v.textContent = el.value; }
    else if (k === 'lora') { st.loras[el.dataset.k] = +el.value; const v = document.getElementById('lv-' + el.dataset.k); if (v) v.textContent = (+el.value).toFixed(2); }
    else st[k] = el.value; }
});
/* photo upload: downscale in the browser (also drops EXIF), then POST the bytes */
async function prepPhoto(file) {
  try {
    const bm = await createImageBitmap(file, { imageOrientation: 'from-image' }), k = Math.min(1, 2048 / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.9));
  } catch (e) { return file; }
}
async function uploadPhoto(file) {
  const b = await prepPhoto(file);
  const r = await fetch('/api/uploads', { method: 'POST', headers: { 'Content-Type': b.type || 'application/octet-stream' }, body: b });
  if (!r.ok) { let m = r.status + ''; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
document.addEventListener('change', async (e) => {
  const el = e.target; if (!el.dataset || el.dataset.up == null || !el.files || !el.files.length) return;
  const k = taskById(S.sec, S.task), r = k && R[k.r]; if (!r) return;
  let files = [...el.files], slot = el.dataset.up;
  if (r.multi) files = files.slice(0, r.multi[1] - S.ups.filter(Boolean).length);
  else files = files.slice(0, 1);
  const tags = files.map((f, n) => (r.multi ? 'b' + Date.now() + n : slot));
  tags.forEach((t) => { S.upBusy[t] = true; }); render.keep = true; render();
  await Promise.all(files.map(async (f, n) => {
    try { const u = await uploadPhoto(f); if (r.multi) S.ups.push(u); else S.ups[+slot] = u; }
    catch (x) { toast(x.message); }
    delete S.upBusy[tags[n]];
  }));
  render.keep = true; render();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  const el = e.target; if (!el.dataset || !el.dataset.enter) return;
  e.preventDefault();
  if (el.dataset.enter === 'ask') { if (el.value.trim()) chatSend(el.value); }
  if (el.dataset.enter === 'cline') cAct('cLineDone', {});
  if (el.dataset.enter === 'chatSend') chatSend(el.value);
});
history.replaceState({ s: 'home' }, '');
render();
