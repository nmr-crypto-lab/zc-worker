<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZC Studio</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e7e9ee;--mut:#8b93a3;--acc:#7c9cff;--acc2:#5a7cf0;--ok:#4cc38a;--warn:#e6a23c;--err:#ef5b5b;--r:10px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:16px;letter-spacing:.3px}#st{color:var(--mut);font-size:12px;margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);padding:12px}}
main>section{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.tab.on{background:var(--acc2);border-color:var(--acc2)}.tab small{color:#ffd28a;margin-left:4px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
select,textarea,input[type=number],input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);cursor:pointer;font-size:12px}.chip.on{border-color:var(--acc);color:var(--acc)}
button.go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:9px;background:var(--acc2);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
button.go:disabled{opacity:.5}
.hint{color:var(--mut);font-size:12px;margin-top:4px}
.lora{display:grid;grid-template-columns:1fr 110px 38px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lora:first-child{border-top:0}.lora .n{font-size:13px}.lora .t{color:var(--mut);font-size:11px;cursor:pointer}
.lora input[type=range]{width:100%}.lora .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;text-align:right}
details>summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:10px}
.inputs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.inputs .slot{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.inputs img{width:100%;height:100%;object-fit:cover}.inputs .x{position:absolute;top:2px;right:2px;background:#000a;border:0;color:#fff;border-radius:6px;cursor:pointer;font-size:11px;padding:1px 5px}
.inputs .empty{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center;padding:4px}
h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.jobs{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;margin-bottom:16px}
.job{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:12px}
.job .s{min-width:84px;font-weight:600}.job .p{color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .bar{flex-basis:100%;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--warn);transition:width .8s linear}
.job .bar i.est{background:repeating-linear-gradient(45deg,var(--warn) 0 8px,#0000 8px 14px),var(--warn);opacity:.75}
.job .ps{flex-basis:100%;color:var(--mut);font-size:11px}
#lb .a button.danger{border-color:var(--err);color:var(--err)}#lb .a button.danger.armed{background:var(--err);color:#fff}
.s.cancelled{color:var(--mut)}.job .x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 7px;cursor:pointer;font:inherit;font-size:12px}.job .x:hover,.job .x.arm{color:var(--err);border-color:var(--err)}#qclr{float:right;font-size:12px;font-weight:400}.s.queued{color:var(--mut)}.s.running{color:var(--warn)}.s.done{color:var(--ok)}.s.error{color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--panel2);cursor:pointer;border:2px solid transparent}
.item img,.item video{width:100%;height:100%;object-fit:cover;display:block}
.item .vph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mut);background:var(--panel2)}
.grid .more{grid-column:1/-1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.item .b{position:absolute;left:6px;bottom:6px;background:#000b;padding:1px 6px;border-radius:6px;font-size:11px}
.item.pick{border-color:var(--acc)}
#lb{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:12px}
#lb .m{max-width:96vw;max-height:78vh}#lb .m img,#lb .m video{max-width:96vw;max-height:78vh;border-radius:8px}
#lb .a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#lb .a button,#lb .a a{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:13px}
.err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}
.pickbar{display:none;background:var(--acc2);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;justify-content:space-between;align-items:center}
.pickbar button{background:#fff2;border:0;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer}
header b{white-space:nowrap}header .nav{white-space:nowrap;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px;border:1px solid transparent}
header .nav.on{color:var(--text);border-color:var(--line);background:var(--panel2)}
.jmore{color:var(--mut);font-size:12px;padding:4px 10px}
/* Create Movie */
#movie{padding:16px;max-width:1500px;margin:0 auto}@media(max-width:860px){#movie{padding:12px}}@media(max-width:520px){header{gap:6px;padding:8px 10px}header .nav{padding:4px 7px;font-size:12px}}
.mv-wrap{display:flex;flex-direction:column;gap:16px}
.mv-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;white-space:nowrap}
.mv-btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}.mv-btn:disabled{opacity:.45;cursor:default}
.mv-btn.sm{padding:4px 9px;font-size:12px}.mv-btn.danger{border-color:var(--err);color:var(--err)}.mv-btn.danger.armed,.mv-btn.armed{background:var(--err);color:#fff;border-color:var(--err)}
.mv-msg{min-height:18px;margin-top:8px;font-size:12px;color:var(--ok)}.mv-msg.err{color:var(--err)}
.mv-new{gap:8px}.mv-plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.mv-pcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mv-pcard span{color:var(--mut);font-size:12px}
.mv-refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:10px}
.mv-ref{background:var(--panel2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mv-ref img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}
.mv-ref .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}.mv-ref .d,.mv-ref .u{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-clips{display:flex;flex-direction:column;gap:10px}
.mv-clip{background:var(--panel2);border-radius:8px;padding:10px;min-width:0}.mv-ch{font-size:13px}.mv-ch .miss{color:var(--err);text-decoration:line-through}
.mv-cp{color:var(--mut);font-size:12px;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mv-vs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mv-tile{position:relative;flex:0 0 120px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--panel);border:2px solid transparent;cursor:pointer}
.mv-tile img{width:100%;height:100%;object-fit:cover;display:block}.mv-tile.sel{border-color:var(--ok)}
.mv-tile .vph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px}
.mv-tile .b{position:absolute;left:4px;bottom:4px;background:#000b;padding:1px 5px;border-radius:5px;font-size:10px}
.mv-tile .o{position:absolute;right:4px;top:4px;background:var(--warn);color:#000;padding:0 5px;border-radius:5px;font-size:10px}
.mv-tile.st-running{border-color:var(--warn)}.mv-tile.st-error{border-color:var(--err)}
.mv-movies{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mv-movie{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px}
.mv-movie .vph{flex:0 0 72px;height:48px;border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mut);overflow:hidden;position:relative}.mv-movie .vph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.mv-movie .vph span{position:relative;text-shadow:0 0 4px #000}
#mv-lb{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:12px}
#mv-lb .m{max-width:min(960px,96vw);max-height:80vh;overflow:auto}#mv-lb .m img,#mv-lb .m video{max-width:96vw;max-height:70vh;border-radius:8px;display:block;margin:0 auto}
#mv-lb .a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#mv-lb .a button,#mv-lb .a a{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:13px}
#mv-lb .a button.on{border-color:var(--ok);color:var(--ok)}#mv-lb .a button.danger{border-color:var(--err);color:var(--err)}#mv-lb .a button.armed{background:var(--err);color:#fff}
.mv-form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:min(900px,92vw)}
.mv-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;max-height:45vh;overflow:auto;margin-bottom:10px}
.ep-clip{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.ep-clip textarea{min-height:70px;margin-top:6px}
.mv-cap{max-width:min(900px,92vw);margin-bottom:8px}
</style>
</head>
<body>
<header><b>ZC Studio</b><span class="nav on" data-v="studio">Studio</span><span class="nav" data-v="movie">Create Movie</span><span class="nav" data-v="users">Testers</span><span id="st">…</span></header>
<main id="studio">
  <section class="card" id="form">
    <div class="tabs" id="tabs"></div>
    <div id="fields"></div>
    <button class="go" id="go">Generate</button>
    <div class="err" id="err"></div>
  </section>
  <section>
    <div class="card" style="margin-bottom:16px"><h3>Queue <button class="x" id="qclr" style="display:none">Clear queue</button></h3><div class="jobs" id="jobs"><div class="hint">Nothing yet</div></div></div>
    <div class="card">
      <div class="pickbar" id="pickbar"><span id="picktxt"></span><button id="pickdone">Done</button></div>
      <div class="row" style="margin-bottom:10px"><h3 style="margin:0">Gallery</h3>
        <div class="chips" style="justify-content:flex-end" id="gf">
          <span class="chip on" data-k="">All</span><span class="chip" data-k="image">Images</span><span class="chip" data-k="video">Videos</span></div></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>
<div id="movie" style="display:none"></div>
<div id="users" style="display:none;padding:16px;max-width:1100px;margin:0 auto">
  <div class="card" style="margin-bottom:16px"><h3>New tester</h3>
    <div class="row" style="flex-wrap:wrap"><input type="text" id="u-name" placeholder="Name, e.g. Mom" style="flex:2 1 160px">
      <select id="u-role" style="flex:1 1 110px"><option value="user">tester</option><option value="admin">admin</option></select>
      <input type="number" id="u-limit" value="60" min="1" title="generations per 24 h" style="flex:1 1 90px">
      <button class="mv-btn pri" id="u-add" style="flex:0 0 auto">Create + link</button></div>
    <div class="hint">The link signs the person in on any phone. Making a new link switches the old unused one off. Limit = generations per 24 hours.</div>
    <div class="err" id="u-msg" style="color:var(--ok)"></div></div>
  <div class="card"><h3>Testers</h3><div id="u-list" class="jobs" style="max-height:none"></div></div>
</div>
<div id="lb"><div class="m" id="lbm"></div><div class="a" id="lba"></div></div>
<script>
const $=s=>document.querySelector(s), FAM_INPUTS={qwen_image21:[0,10],flux3_klein:[0,10],qwen_aio:[1,1],wan22_i2v:[1,1],h3_fl2va:[1,2],h3_ref2va:[1,9]};
const HINTS={
 gif:"Describe the picture in plain words (English works best). It comes alive as a short seamless loop, ~3 s. Safe-for-work only.",
 zimage:"Plain English description. Turbo models: 8 steps, the negative prompt is ignored.",
 illustrious:"Danbooru tags separated by commas (1girl, long hair, …). \"mature female, adult\" is added automatically.",
 qwen_image21:"Plain English. Without references: text-to-image. With references: say what each one is — \"the man from image 1 sits at the desk in the room from image 2\" — or give an edit instruction and choose \"Same as reference 1\".",
 flux3_klein:"Plain English. With references, name them in order: \"the man from the first image at the desk in the room from the second image\". Safe-for-work only: this model is not trained on nudity — for NSFW, edit the result with Qwen Rapid-AIO.",
 qwen_aio:"What to change in the image. Example: change the dress to red, keep everything else the same.",
 wan22_i2v:"Describe the motion and the camera. No sound, 16 fps, up to 5 s.",
 h3_fl2va:"Scene, motion, speech in quotes, and sounds. The image is &lt;Picture 1&gt;. A second image (optional) becomes the last frame.",
 h3_ref2va:"Refer to the reference characters as &lt;Picture 1&gt;, &lt;Picture 2&gt;… Describe the scene, actions, speech and sound."};
let M=null, fam=null, inputs=[], picking=false, gkind="", loraVals={};
const api=(p,o)=>fetch(p,o).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j});
const fileUrl=p=>"/files/"+p.split("/").map(encodeURIComponent).join("/");
const isVid=p=>/\.(mp4|webm|mov)$/i.test(p);

async function init(){
  M=await api("/api/models");
  const order=["gif","zimage","qwen_image21","flux3_klein","illustrious","qwen_aio","wan22_i2v","h3_fl2va","h3_ref2va"];
  const fams=order.filter(f=>M.families[f]&&M.families[f].models.length);
  $("#tabs").innerHTML=fams.map(f=>`<button class="tab" data-f="${f}">${M.families[f].label.replace(/^(Image|Video): /,"").replace(/^./,c=>c.toUpperCase())}${M.families[f].status!=="ready"?"<small>β</small>":""}</button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(b)setFam(b.dataset.f)};
  setFam(localStorage.getItem("zc_fam")&&fams.includes(localStorage.getItem("zc_fam"))?localStorage.getItem("zc_fam"):fams[0]);
  await poll(); setInterval(poll,2500); loadGallery(); setInterval(loadGallery,12000);
}
function setFam(f){
  fam=f; try{localStorage.setItem("zc_fam",f)}catch(e){}
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.f===f));
  const F=M.families[f], dm=F.models.find(m=>m.default)||F.models[0];
  inputs=inputs.slice(0,(FAM_INPUTS[f]||[0,0])[1]);
  let h=`<div ${f==="gif"?'style="display:none"':""}><label>Model</label><select id="model">${F.models.map(m=>`<option value="${m.key}" ${m===dm?"selected":""}>${m.label}</option>`).join("")}</select></div>`;
  if(FAM_INPUTS[f]) h+=`<label>${f==="h3_ref2va"?"References (up to 9, from the gallery)":(f==="qwen_image21"||f==="flux3_klein")?"References (optional, up to 10, from the gallery)":f==="h3_fl2va"?"First frame (+ optional last frame)":"Source image"}</label><div class="inputs" id="inputs"></div>`;
  h+=`<label>Prompt</label><textarea id="prompt" placeholder="…"></textarea><div class="hint">${HINTS[f]||""}</div>`;
  if(f==="gif") h+=`<label>Ideas</label><div class="chips" id="gifx">${GIF_IDEAS.map((x,i)=>`<span class="chip" data-i="${i}">${x[0]}</span>`).join("")}</div>
     <label>Text on the GIF (optional)</label><input type="text" id="gtext" maxlength="80" placeholder="Good morning!">
     <label>Text position</label><div class="chips" id="tpos"><span class="chip" data-v="top">Top</span><span class="chip" data-v="middle">Middle</span><span class="chip on" data-v="bottom">Bottom</span></div>`;
  if(f==="zimage"||f==="illustrious"){
    h+=`<label>Size</label><div class="chips" id="size">${[["832x1216","Portrait"],["1024x1024","Square"],["1216x832","Landscape"]].map((s,i)=>`<span class="chip ${i?"":"on"}" data-v="${s[0]}">${s[1]}</span>`).join("")}</div>
       <details><summary>Negative prompt</summary><textarea id="neg" style="min-height:60px" placeholder="model default"></textarea></details>`;
  }
  if(f==="qwen_image21"||f==="flux3_klein") h+=`<label>Size</label><div class="chips" id="size">${[["896x1344","Portrait"],["1152x1152","Square"],["1344x896","Landscape"],["1536x864","Wide 16:9"]].concat(f==="qwen_image21"?[["same","Same as reference 1"]]:[]).map((s,i)=>`<span class="chip ${i?"":"on"}" data-v="${s[0]}">${s[1]}</span>`).join("")}</div>`;
  if(f==="wan22_i2v") h+=`<label>Length: <span id="secv">5</span> s</label><input type="range" id="sec" min="1" max="5" step="1" value="5" style="width:100%">
     <label>Size</label><div class="chips" id="size">${[["480x832","Vertical 480p"],["832x480","Horizontal 480p"],["720x1280","Vertical 720p"]].map((s,i)=>`<span class="chip ${i?"":"on"}" data-v="${s[0]}">${s[1]}</span>`).join("")}</div>`;
  if(f==="h3_fl2va"||f==="h3_ref2va") h+=`<label>Length: <span id="secv">5</span> s</label><input type="range" id="sec" min="4" max="15" step="1" value="5" style="width:100%">
     <label>Quality</label><div class="chips" id="mp"><span class="chip on" data-v="0.5">Fast (0.5 MP)</span><span class="chip" data-v="0.9">Standard (0.9 MP)</span></div>
     ${f==="h3_ref2va"?`<label>Aspect ratio</label><div class="chips" id="aspect">${["9:16","16:9","1:1","3:4"].map((a,i)=>`<span class="chip ${i?"":"on"}" data-v="${a}">${a}</span>`).join("")}</div>`:""}`;
  if(F.loras.length){
    h+=`<details ${Object.keys(loraVals).some(k=>F.loras.find(l=>l.key===k)&&loraVals[k]>0)?"open":""}><summary>LoRA (${F.loras.length})</summary><div id="loras">${F.loras.map(l=>`
      <div class="lora"><div><div class="n">${l.label}</div>${l.triggers?`<div class="t" data-t="${l.triggers.replace(/"/g,"&quot;")}" title="insert into prompt">⤷ ${l.triggers}</div>`:""}</div>
      <input type="range" min="0" max="1.5" step="0.05" value="${loraVals[l.key]||0}" data-k="${l.key}"><span class="v">${(loraVals[l.key]||0).toFixed(2)}</span></div>`).join("")}</div></details>`;
  }
  h+=`<label>Variants</label><select id="nvar">${[1,2,3,4].map(n=>`<option value="${n}" ${n===nVar?"selected":""}>${n}</option>`).join("")}</select>
    <div class="hint">Each variant is a separate job with its own seed. The model stays loaded, so extra variants are fast.</div>`;
  h+=`<details><summary>Seed</summary><div class="row"><input type="number" id="seed" placeholder="random"><span></span></div></details>`;
  $("#fields").innerHTML=h;
  $("#nvar").onchange=e=>nVar=+e.target.value;
  document.querySelectorAll("#fields .chips").forEach(c=>c.onclick=e=>{const x=e.target.closest(".chip");if(!x)return;c.querySelectorAll(".chip").forEach(y=>y.classList.remove("on"));x.classList.add("on")});
  const gx=$("#gifx"); if(gx) gx.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const x=GIF_IDEAS[+c.dataset.i];$("#prompt").value=x[1];$("#gtext").value=x[2]};
  const sec=$("#sec"); if(sec) sec.oninput=()=>$("#secv").textContent=sec.value;
  const L=$("#loras"); if(L){L.oninput=e=>{if(e.target.dataset.k){loraVals[e.target.dataset.k]=+e.target.value;e.target.nextElementSibling.textContent=(+e.target.value).toFixed(2)}};
    L.onclick=e=>{const t=e.target.closest(".t");if(t){const p=$("#prompt");p.value=(p.value?p.value.replace(/\s*$/,", "):"")+t.dataset.t}}}
  renderInputs();
}
function renderInputs(){
  const box=$("#inputs"); if(!box) return; const [mn,mx]=FAM_INPUTS[fam];
  box.innerHTML=inputs.map((p,i)=>`<div class="slot"><img src="${fileUrl(p)}"><button class="x" data-i="${i}">✕</button></div>`).join("")+
    (inputs.length<mx?`<div class="slot empty" id="addin">＋ from<br>gallery</div>`:"");
  box.onclick=e=>{if(e.target.dataset.i!==undefined){inputs.splice(+e.target.dataset.i,1);renderInputs();return}
    if(e.target.closest("#addin")) startPick()};
}
function startPick(){picking=true;$("#pickbar").style.display="flex";$("#picktxt").textContent="Pick an image in the gallery";gkind="image";
  document.querySelectorAll("#gf .chip").forEach(c=>c.classList.toggle("on",c.dataset.k==="image"));loadGallery();
  $("#pickbar").scrollIntoView({behavior:"smooth",block:"center"})}
$("#pickdone").onclick=()=>{picking=false;$("#pickbar").style.display="none";renderInputs();$("#form").scrollIntoView({behavior:"smooth"})};
function chipVal(id){const c=document.querySelector(`#${id} .chip.on`);return c?c.dataset.v:null}

let nVar=1;
const GIF_IDEAS=[
 ["Good morning","a steaming cup of coffee on a sunny windowsill, morning light, flowers in a vase, steam rising","Good morning!"],
 ["Good night","a cozy moonlit night sky over a quiet village, twinkling stars, soft clouds drifting","Good night!"],
 ["Weekend","a hammock between palm trees on a tropical beach, gentle waves, sunny day","Have a great weekend!"],
 ["Birthday","a birthday cake with lit candles, colorful balloons and confetti, festive","Happy birthday!"],
 ["Thank you","a bouquet of pink roses with sparkles, soft pastel background","Thank you!"],
 ["Rainy day","a cute kitten looking out of a window at the rain, cozy room, raindrops on the glass","Have a cozy day"]];
$("#go").onclick=async()=>{
  $("#err").textContent=""; const F=M.families[fam]; const req={family:fam,model:$("#model").value,prompt:$("#prompt").value.trim()};
  if(!req.prompt&&fam!=="qwen_aio"){$("#err").textContent="Write a prompt";return}
  if(FAM_INPUTS[fam]){ if(inputs.length<FAM_INPUTS[fam][0]){$("#err").textContent="Pick an image from the gallery";return} req.images=inputs.map(p=>({path:p})) }
  const sz=chipVal("size"); if(sz==="same"){ if(!inputs.length){$("#err").textContent="\"Same as reference 1\" needs a reference image";return} req.keep_size=true } else if(sz){const [w,h]=sz.split("x").map(Number);req.width=w;req.height=h}
  const neg=$("#neg"); if(neg&&neg.value.trim()) req.negative=neg.value.trim();
  const sec=$("#sec"); if(sec) req.seconds=+sec.value;
  if(fam==="gif"){const t=$("#gtext").value.trim(); if(t) req.text=t; req.text_pos=chipVal("tpos")||"bottom"}
  const mp=chipVal("mp"); if(mp) req.megapixels=+mp; const ar=chipVal("aspect"); if(ar) req.aspect=ar;
  const lo={}; F.loras.forEach(l=>{if((loraVals[l.key]||0)>0) lo[l.key]=loraVals[l.key]}); req.loras=lo;
  const sd=$("#seed").value; const n=+($("#nvar")?.value||1);
  $("#go").disabled=true;
  try{for(let k=0;k<n;k++){const r={...req}; if(sd!=="") r.seed=+sd+k;   // fixed seed -> seed, seed+1, ...; otherwise random per job
      await api("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(r)})}
    poll()}
  catch(e){$("#err").textContent=e.message} finally{setTimeout(()=>$("#go").disabled=false,600)}
};

const ARM={stop:null,until:0,clr:0};
const ST={queued:"queued",running:"generating",done:"done",error:"error",cancelled:"cancelled"};
let lastDone="";
async function poll(){
  try{
    const [js,s]=await Promise.all([api("/api/jobs?all=1"),api("/api/status")]);
    if(!!s.thumbs!==THUMBS){THUMBS=!!s.thumbs;loadGallery(true)}
    $("#st").textContent=`${(s.gpu.name||"GPU…").replace(/^cuda:\d+\s*/,"").split(" : ")[0]} · free ${s.gpu.vram_free_gb??"?"}/${s.gpu.vram_total_gb??"?"} GB · queued ${s.queued}${s.running?" · generating":""}`;
    const qd=js.filter(j=>j.status==="queued"), shown=js.filter(j=>j.status!=="queued").concat(qd.slice(-5));
    const order=j=>({running:0,queued:1}[j.status]??2), vis=shown.sort((a,b)=>order(a)-order(b)||(a.status==="queued"?a.queue_pos-b.queue_pos:0));
    $("#jobs").innerHTML=js.length?vis.map(j=>`<div class="job"><span class="s ${j.status}">${ST[j.status]}${j.status==="queued"&&j.queue_pos?" #"+j.queue_pos:""}</span>
      <span class="p">${j.label?`<b>${j.label}</b> · `:`${j.family} · `}${(j.prompt||"").replace(/</g,"&lt;")}</span><span>${j.secs}s</span>${j.status==="queued"?`<button class="x" data-c="${j.id}" title="Remove from the queue">✕</button>`:j.status==="running"?(j.cancel?`<span class="ps" style="flex-basis:auto">stopping…</span>`:(ARM.stop===j.id&&ARM.until>Date.now()?`<button class="x arm" data-c="${j.id}" data-run="1">Stop? tap again</button>`:`<button class="x" data-c="${j.id}" data-run="1" title="Stop this job">Stop</button>`)):""}${progHtml(j)}
      ${j.error?`<span style="color:var(--err)">${j.error.replace(/</g,"&lt;")}</span>`:""}${j.note?`<span style="color:var(--warn)">${j.note}</span>`:""}
      ${j.label?"":(j.outputs||[]).map(o=>`<a href="#" data-p="${o.path}" style="color:var(--acc)">open</a>`).join(" ")}</div>`).join("")
      +(qd.length>5?`<div class="jmore">+ ${qd.length-5} more in the queue</div>`:""):`<div class="hint">Nothing yet</div>`;
    const ca=ARM.clr>Date.now(); $("#qclr").style.display=qd.length>1?"":"none"; $("#qclr").classList.toggle("arm",ca);
    $("#qclr").textContent=ca?"Remove all queued? tap again":`Clear queue (${qd.length})`;
    const d=js.filter(j=>j.status==="done").map(j=>j.id).join(); if(d!==lastDone){lastDone=d;loadGallery()}
  }catch(e){$("#st").textContent="no connection to the server"}
}
const fmtT=s=>s==null?"":s>=60?`${Math.floor(s/60)}m ${String(s%60).padStart(2,"0")}s`:`${s}s`;
const STAGE={"queued":"Starting","waiting for GPU":"Waiting for GPU","loading models":"Loading models","encoding prompt":"Encoding prompt","generating":"Generating",
  "decoding":"Decoding","saving":"Saving","age check":"Age check"};
function progHtml(j){
  const p=j.progress; if(j.status!=="running"||!p) return "";
  const est=p.stage==="loading models", pct=Math.round(100*Math.min(1,p.frac||0));
  const txt=[STAGE[p.stage]||p.stage, p.detail, est?"(estimate)":"", p.eta!=null?`· ~${fmtT(p.eta)} left`:""].filter(Boolean).join(" ");
  return `<div class="bar"><i class="${est?"est":""}" style="width:${["queued","waiting for GPU","age check","saving"].includes(p.stage)?100:pct}%"></i></div><div class="ps">${txt}</div>`;
}
$("#jobs").onclick=async e=>{
  const a=e.target.closest("a[data-p]");if(a){e.preventDefault();openLb(a.dataset.p);return}
  const b=e.target.closest("button[data-c]");if(!b)return;
  if(b.dataset.run&&!(ARM.stop===b.dataset.c&&ARM.until>Date.now())){ARM.stop=b.dataset.c;ARM.until=Date.now()+4000;b.classList.add("arm");b.textContent="Stop? tap again";return}
  ARM.stop=null;
  b.disabled=true;try{await api(`/api/jobs/${b.dataset.c}/cancel`,{method:"POST"})}catch(err){}poll()};
$("#qclr").onclick=async()=>{const b=$("#qclr");if(!(ARM.clr>Date.now())){ARM.clr=Date.now()+4000;b.classList.add("arm");b.textContent="Remove all queued? tap again";return}
  ARM.clr=0;b.disabled=true;try{await api("/api/jobs/cancel_queued",{method:"POST"})}catch(err){}b.disabled=false;poll()};
document.querySelectorAll("#gf .chip").forEach(c=>c.onclick=()=>{gkind=c.dataset.k;document.querySelectorAll("#gf .chip").forEach(x=>x.classList.toggle("on",x===c));loadGallery()});
let gSig="", gLimit=60, THUMBS=false;
function tile(i){
  const vid=isVid(i.path), th=`/thumb/${i.path.split("/").map(encodeURIComponent).join("/")}?v=${i.mtime}`;
  const inner=THUMBS?`<img loading="lazy" decoding="async" src="${th}">`
    :(vid?`<div class="vph">▶</div>`:`<img loading="lazy" decoding="async" src="${fileUrl(i.path)}">`);
  return `<div class="item ${inputs.includes(i.path)?"pick":""}" data-p="${i.path}">${inner}${vid?`<span class="b">▶ video</span>`:""}</div>`;
}
async function loadGallery(force){
  const g=await api("/api/gallery?all=1&limit="+gLimit+(gkind?"&kind="+gkind:"")).catch(()=>null); if(!g) return;
  const sig=gLimit+"|"+gkind+"|"+THUMBS+"|"+inputs.join()+"|"+g.map(i=>i.path+i.mtime).join();
  if(sig===gSig&&!force) return;            // nothing changed: do not rebuild the grid (keeps phones fast)
  gSig=sig;
  $("#grid").innerHTML=(g.map(tile).join("")||`<div class="hint">Results will appear here</div>`)+
    (g.length>=gLimit?`<button class="more" id="gmore">Show more</button>`:"");
  const m=$("#gmore"); if(m) m.onclick=e=>{e.stopPropagation();gLimit+=60;loadGallery(true)};
}
$("#grid").onclick=e=>{const it=e.target.closest(".item");if(!it)return;const p=it.dataset.p;
  if(picking){ if(isVid(p)) return; const mx=(FAM_INPUTS[fam]||[0,1])[1]; if(inputs.includes(p)) inputs=inputs.filter(x=>x!==p); else if(inputs.length<mx) inputs.push(p);
    it.classList.toggle("pick",inputs.includes(p)); $("#picktxt").textContent=`Selected ${inputs.length} of ${mx}`; if(inputs.length>=mx&&mx===1) $("#pickdone").click(); return}
  openLb(p)};
function openLb(p){
  $("#lbm").innerHTML=isVid(p)?`<video src="${fileUrl(p)}" controls autoplay playsinline preload="auto"></video>`:`<img src="${fileUrl(p)}">`;
  const acts=[`<a href="${fileUrl(p)}?dl=1" download>Download</a>`];
  SHARE=null; if(navigator.canShare&&/\.(gif|mp4)$/i.test(p)){acts.unshift(`<button data-a="share" style="border-color:var(--ok);color:var(--ok)">Share…</button>`);
    // greeting GIFs: share the MP4 — messengers (WhatsApp) send a shared .gif as a still picture; a short MP4 can be sent as GIF
    const sp=/^gif\/.*\.gif$/i.test(p)?p.replace(/\.gif$/i,".mp4"):p;
    fetch(fileUrl(sp)).then(r=>r.blob()).then(b=>{const f=new File([b],sp.split("/").pop(),{type:b.type||(/gif$/i.test(sp)?"image/gif":"video/mp4")});
      if(navigator.canShare({files:[f]})) SHARE=f}).catch(()=>{})}
  if(/^gif\//.test(p)){const o=p.replace(/\.(gif|mp4)$/i,m=>m.toLowerCase()===".gif"?".mp4":".gif");acts.splice(1,0,`<a href="${fileUrl(o)}?dl=1" download>${/gif$/i.test(p)?"MP4":"GIF"}</a>`)}
  if(!isVid(p)&&!/\.gif$/i.test(p)){acts.push(`<button data-a="edit">Edit</button>`,`<button data-a="wan22_i2v">Video (Wan)</button>`,`<button data-a="h3_fl2va">Video (H3)</button>`,`<button data-a="h3_ref2va">Add to H3 references</button>`)}
  acts.push(`<button data-a="del" class="danger">Delete</button>`,`<button data-a="close">Close</button>`);
  $("#lba").innerHTML=acts.join(""); $("#lb").style.display="flex"; $("#lb").dataset.p=p;
}
let SHARE=null;
$("#lb").onclick=e=>{const a=e.target.dataset.a;
  if(a==="share"){ if(!SHARE){e.target.textContent="Preparing… tap again";return}
    navigator.share({files:[SHARE]}).catch(err=>{if(err.name!=="AbortError")e.target.textContent="Sharing not available: use Download"});return} if(e.target.id==="lb"||a==="close"){$("#lb").style.display="none";$("#lbm").innerHTML="";return}
  if(a==="del"){const b=e.target, p=$("#lb").dataset.p;
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to delete";setTimeout(()=>{b.classList.remove("armed");b.textContent="Delete"},4000);return}
    api("/api/files/"+p.split("/").map(encodeURIComponent).join("/"),{method:"DELETE"}).then(()=>{inputs=inputs.filter(x=>x!==p);
      $("#lb").style.display="none";$("#lbm").innerHTML="";loadGallery();try{renderInputs()}catch(_){}}).catch(err=>{b.textContent="Error: "+err.message});return}
  if(a){const p=$("#lb").dataset.p; const f=a==="edit"?"qwen_aio":a; if(!M.families[f])return;
    if(f==="h3_ref2va"&&fam==="h3_ref2va"){if(!inputs.includes(p)&&inputs.length<9)inputs.push(p)} else inputs=[p];
    $("#lb").style.display="none";$("#lbm").innerHTML=""; setFam(f); $("#form").scrollIntoView({behavior:"smooth"})}};
init().catch(e=>{$("#st").textContent="Loading error: "+e.message});
</script>
<script src="/ui/movie.js"></script>
<script>
(() => {
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const link = t => location.origin + "/i/" + t;
  const say = (t, err) => { const m = $("#u-msg"); m.textContent = t; m.style.color = err ? "var(--err)" : "var(--ok)"; };
  async function copy(t) { try { await navigator.clipboard.writeText(t); say("Link copied: " + t); } catch (e) { say(t); } }
  async function load() {
    const us = await api("/api/admin/users").catch(e => { say(e.message, true); return []; });
    $("#u-list").innerHTML = us.map(u => `<div class="job" data-id="${u.id}">
      <span class="s" style="min-width:120px">${esc(u.name)}${u.role === "admin" ? ' <small style="color:var(--warn)">admin</small>' : ""}${u.disabled ? ' <small style="color:var(--err)">off</small>' : ""}</span>
      <span class="p">${u.jobs_24h} today · ${u.jobs_total} total · ${u.files} files</span>
      <label style="margin:0;display:flex;gap:4px;align-items:center">limit <input type="number" value="${u.daily_limit}" data-a="limit" style="width:80px;padding:4px"></label>
      ${u.invite ? `<button class="x" data-a="copy" data-t="${u.invite}">Copy link</button>` : ""}
      <button class="x" data-a="new">New link</button>
      <button class="x" data-a="off">${u.disabled ? "Turn on" : "Turn off"}</button></div>`).join("") || `<div class="hint">No testers yet.</div>`;
  }
  $("#u-add").onclick = async () => {
    try { const r = await api("/api/admin/users", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("#u-name").value, role: $("#u-role").value, daily_limit: +$("#u-limit").value || 60 }) });
      $("#u-name").value = ""; await load(); copy(link(r.invite)); } catch (e) { say(e.message, true); }
  };
  $("#u-list").addEventListener("click", async e => {
    const b = e.target.closest("button[data-a]"); if (!b) return; const id = b.closest("[data-id]").dataset.id;
    if (b.dataset.a === "copy") return copy(link(b.dataset.t));
    if (b.dataset.a === "new") { const r = await api(`/api/admin/users/${id}/invite`, { method: "POST" }); await load(); return copy(link(r.invite)); }
    if (b.dataset.a === "off") { const on = b.textContent === "Turn on"; await api(`/api/admin/users/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ disabled: on ? 0 : 1 }) }); return load(); }
  });
  $("#u-list").addEventListener("change", async e => {
    if (e.target.dataset.a !== "limit") return; const id = e.target.closest("[data-id]").dataset.id;
    await api(`/api/admin/users/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ daily_limit: +e.target.value }) });
    say("Limit saved"); load();
  });
  const sv = window.showView;
  window.showView = v => { sv(v === "users" ? "none" : v); $("#users").style.display = v === "users" ? "" : "none";
    document.querySelectorAll("header .nav").forEach(n => n.classList.toggle("on", n.dataset.v === v)); if (v === "users") load(); };
  document.querySelectorAll("header .nav").forEach(n => n.onclick = () => window.showView(n.dataset.v));
})();
</script>
