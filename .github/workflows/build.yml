# Build the worker image and push it to GitHub Container Registry: ghcr.io/nmr-crypto-lab/zc-worker
# Runs on every push that touches the image, or by hand (Actions -> build-image -> Run workflow).
name: build-image
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "requirements.txt", "app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the CUDA/torch base image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nmr-crypto-lab/zc-worker:latest
            ghcr.io/nmr-crypto-lab/zc-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - run: df -h /
